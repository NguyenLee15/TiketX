services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - tickex_sqlserver_data:/var/opt/mssql
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  sql-bootstrap:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver,1433 -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
      -v MSSQL_APP_USER="$$MSSQL_APP_USER" MSSQL_APP_PASSWORD="$$MSSQL_APP_PASSWORD"
      MSSQL_HANGFIRE_USER="$$MSSQL_HANGFIRE_USER" MSSQL_HANGFIRE_PASSWORD="$$MSSQL_HANGFIRE_PASSWORD"
      MSSQL_MIGRATOR_USER="$$MSSQL_MIGRATOR_USER" MSSQL_MIGRATOR_PASSWORD="$$MSSQL_MIGRATOR_PASSWORD"
      -i /scripts/bootstrap-sql-principals.sql
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_APP_USER: ${MSSQL_APP_USER:?Set MSSQL_APP_USER in .env}
      MSSQL_APP_PASSWORD: ${MSSQL_APP_PASSWORD:?Set MSSQL_APP_PASSWORD in .env}
      MSSQL_HANGFIRE_USER: ${MSSQL_HANGFIRE_USER:?Set MSSQL_HANGFIRE_USER in .env}
      MSSQL_HANGFIRE_PASSWORD: ${MSSQL_HANGFIRE_PASSWORD:?Set MSSQL_HANGFIRE_PASSWORD in .env}
      MSSQL_MIGRATOR_USER: ${MSSQL_MIGRATOR_USER:?Set MSSQL_MIGRATOR_USER in .env}
      MSSQL_MIGRATOR_PASSWORD: ${MSSQL_MIGRATOR_PASSWORD:?Set MSSQL_MIGRATOR_PASSWORD in .env}
    volumes:
      - ./backend/scripts:/scripts:ro
    networks: [private]
    depends_on:
      sqlserver:
        condition: service_healthy

  db-migrator:
    image: tickex-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=TickeXDb;User Id=${MSSQL_MIGRATOR_USER};Password=${MSSQL_MIGRATOR_PASSWORD};TrustServerCertificate=True;
      ConnectionStrings__HangfireConnection: Server=sqlserver,1433;Database=TickeXHangfire;User Id=${MSSQL_MIGRATOR_USER};Password=${MSSQL_MIGRATOR_PASSWORD};TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      DataProtection__KeyRingPath: /var/tickex-dpkeys
    volumes:
      - tickex_dpkeys:/var/tickex-dpkeys
    networks: [private]
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-bootstrap:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 60 1 --loglevel warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    networks: [private]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: tickex-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=TickeXDb;User Id=${MSSQL_APP_USER};Password=${MSSQL_APP_PASSWORD};TrustServerCertificate=True;
      ConnectionStrings__HangfireConnection: Server=sqlserver,1433;Database=TickeXHangfire;User Id=${MSSQL_HANGFIRE_USER};Password=${MSSQL_HANGFIRE_PASSWORD};TrustServerCertificate=True;
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
      DataProtection__KeyRingPath: /var/tickex-dpkeys
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      TicketSecurity__ActiveKeyId: key-2026-v1
      TicketSecurity__SecretKeys__key-2026-v1: ${TICKET_SIGNING_KEY:?Set TICKET_SIGNING_KEY in .env}
      PayOS__ClientId: ${PAYOS_CLIENT_ID:?Set PAYOS_CLIENT_ID in .env}
      PayOS__ApiKey: ${PAYOS_API_KEY:?Set PAYOS_API_KEY in .env}
      PayOS__ChecksumKey: ${PAYOS_CHECKSUM_KEY:?Set PAYOS_CHECKSUM_KEY in .env}
      PayOS__PayoutClientId: ${PAYOS_PAYOUT_CLIENT_ID:?Set PAYOS_PAYOUT_CLIENT_ID in .env}
      PayOS__PayoutApiKey: ${PAYOS_PAYOUT_API_KEY:?Set PAYOS_PAYOUT_API_KEY in .env}
      PayOS__PayoutChecksumKey: ${PAYOS_PAYOUT_CHECKSUM_KEY:?Set PAYOS_PAYOUT_CHECKSUM_KEY in .env}
      PayOS__ReturnUrl: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}/payment-result
      PayOS__CancelUrl: ${PUBLIC_ORIGIN}/my-tickets
      Smtp__Server: ${SMTP_SERVER:?Set SMTP_SERVER in .env}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      Smtp__Password: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in .env}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
    volumes:
      - tickex_dpkeys:/var/tickex-dpkeys
    networks: [private]
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-bootstrap:
        condition: service_completed_successfully
      db-migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: tickex-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    networks: [private, public]
    depends_on:
      backend:
        condition: service_healthy

networks:
  private:
    internal: true
  public:

volumes:
  tickex_sqlserver_data:
  tickex_dpkeys:
