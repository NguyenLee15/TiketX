name: TickeX CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-build-and-test:
    name: Backend Build & Automated Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore backend/TickeX.sln

    - name: Build Backend Solution
      run: dotnet build backend/TickeX.sln --no-restore --configuration Release

    - name: Run backend tests with coverage
      run: dotnet test backend/TickeX.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --verbosity normal

  frontend-build-and-typecheck:
    name: Frontend Build & Type Check (React 19 / TypeScript / Vite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: cd frontend && npm ci

    - name: TypeScript Type Check & Production Bundle Build
      run: cd frontend && npm run build

    - name: Run frontend tests
      run: cd frontend && npm run test

    - name: Audit production frontend dependencies
      run: cd frontend && npm audit --omit=dev --audit-level=high

  container-smoke:
    name: Production Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build-and-typecheck]
    env:
      MSSQL_SA_PASSWORD: CiOnly!2026Password
      RABBITMQ_DEFAULT_USER: tickex-ci
      RABBITMQ_DEFAULT_PASS: CiOnly!2026Password
      REDIS_PASSWORD: CiOnly!2026Password
      JWT_KEY: ci-only-jwt-key-that-is-at-least-32-characters
      TICKET_SIGNING_KEY: ci-only-ticket-signing-key-that-is-at-least-32-characters
      PAYOS_CLIENT_ID: ci-payos-client-id
      PAYOS_API_KEY: ci-payos-api-key
      PAYOS_CHECKSUM_KEY: ci-payos-checksum-key
      SMTP_SERVER: smtp.invalid
      SMTP_USERNAME: ci-smtp-user
      SMTP_PASSWORD: ci-smtp-password
      SMTP_FROM_EMAIL: ci@tickex.invalid
      PUBLIC_ORIGIN: https://tickex-ci.invalid

    steps:
    - uses: actions/checkout@v7

    - name: Validate production Compose contract
      run: docker compose --env-file .env.example config -q

    - name: Build and start private infrastructure
      run: docker compose --env-file .env.example up -d --build sqlserver redis rabbitmq

    - name: Apply migrations once
      run: docker compose --env-file .env.example run --rm backend --migrate

    - name: Start application and verify readiness
      run: |
        docker compose --env-file .env.example up -d backend frontend
        for i in {1..30}; do curl --fail --silent http://127.0.0.1:3000/health/ready && exit 0; sleep 5; done
        docker compose --env-file .env.example logs --no-color
        exit 1

    - name: Scan production images (Frontend)
      uses: aquasecurity/trivy-action@v0.33.1
      with:
        image-ref: tickex-frontend:latest
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH

    - name: Scan production images (Backend)
      uses: aquasecurity/trivy-action@v0.33.1
      with:
        image-ref: tickex-backend:latest
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH

    - name: Collect Compose logs
      if: always()
      run: docker compose --env-file .env.example logs --no-color
